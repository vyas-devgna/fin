<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fin</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="description" content="A calm, offline money app. Know what you have, where it is, and where it should go next.">
<meta name="theme-color" content="#F4F4F7">
<meta name="color-scheme" content="light dark">

<!-- Standalone behaviour on iOS, where the manifest is only partly honoured. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fin">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">

<!-- Premium Custom Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="app.css">
</head>
<body class="booting">

<!-- Rendered opaque from the very first paint when the lock is on, so balances
     are never briefly visible behind it. app.js removes `armed` after unlock. -->
<div id="lock" class="lock" hidden>
  <div class="lock-inner">
    <div class="lock-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 11h12a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1ZM8 11V7.5a4 4 0 1 1 8 0V11"/>
      </svg>
    </div>
    <h1>Fin is locked</h1>
    <p id="lock-msg">Verify to continue</p>
    <button id="lock-btn" class="btn btn-primary">Unlock</button>
  </div>
</div>

<main id="app" role="main"></main>

<nav id="tabbar" aria-label="Sections"></nav>

<div id="sheets"></div>
<div id="toasts" aria-live="polite"></div>

<noscript>
  <p style="padding:40px;text-align:center;font-family:system-ui">Fin needs JavaScript. Everything runs on your device — nothing is sent anywhere.</p>
</noscript>

<script type="module" src="app.js"></script>
</body>
</html>
